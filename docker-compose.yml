version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: python ws1_backend/main.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ASR_ENGINE=mock
      - ENABLE_MOCK_ASR=true
    restart: unless-stopped

  chaos-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    command: python ws4_eval/proxy.py --listen-host 0.0.0.0 --listen-port 8001 --target-host backend --target-port 8000
    ports:
      - "8001:8001"
    environment:
      - LISTEN_PORT=8001
      - TARGET_HOST=backend
      - TARGET_PORT=8000
    depends_on:
      - backend
    restart: unless-stopped

  eval-benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    command: python ws4_eval/eval_protocol.py
    profiles:
      - eval
    depends_on:
      - backend
